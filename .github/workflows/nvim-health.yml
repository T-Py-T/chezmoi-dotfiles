# .github/workflows/nvim-health.yml
# Validates the NeoVim config by running :checkhealth headlessly.
# Fails the workflow if any ERROR lines appear in the health report.
# Does not run the full chezmoi apply - copies the nvim config directly.

name: nvim health check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "dot_config/nvim/**"
      - "scripts/check-nvim-health.sh"

jobs:
  nvim-health:
    name: checkhealth
    runs-on: ubuntu-24.04

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install neovim
        run: |
          case "$(uname -m)" in
            x86_64)
              archive="nvim-linux-x86_64"
              checksum="474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87"
              ;;
            aarch64|arm64)
              archive="nvim-linux-arm64"
              checksum="8f1f64a0bdb97247034038c3823c6cbad5bdf9ecd5751b85494b71c3ee04c815"
              ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fLO "https://github.com/neovim/neovim/releases/download/v0.12.6/${archive}.tar.gz"
          echo "${checksum}  ${archive}.tar.gz" | sha256sum --check --strict
          tar -xzf "${archive}.tar.gz" -C /tmp
          echo "/tmp/${archive}/bin" >> "$GITHUB_PATH"

      - name: install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git \
            curl \
            luarocks \
            build-essential \
            cmake \
            ninja-build \
            ncurses-bin \
            pkg-config \
            ripgrep \
            fd-find

      - name: install node (for tree-sitter-cli)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: install tree-sitter-cli
        run: npm install -g tree-sitter-cli@0.27.1

      - name: copy nvim config
        run: |
          mkdir -p "$HOME/.config"
          # chezmoi uses dot_ prefix convention - copy and rename
          cp -r dot_config/nvim "$HOME/.config/nvim"

      - name: bootstrap vim.pack plugins
        run: |
          # A plain headless boot triggers vim.pack.add() to clone every plugin URL
          # listed in init.lua, and fires the PackChanged autocmd (which builds
          # telescope-fzf-native via `make`). Timeout at 5 minutes in case of a hang.
          timeout 300 nvim --headless -c "qa" 2>/dev/null || true
        env:
          TERM: xterm-256color

      - name: run checkhealth
        run: |
          chmod +x scripts/check-nvim-health.sh
          bash scripts/check-nvim-health.sh
        env:
          TERM: xterm-256color
