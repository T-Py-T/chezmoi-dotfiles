# .github/workflows/nvim-health.yml
# Validates the NeoVim config by running :checkhealth headlessly.
# Fails the workflow if any ERROR lines appear in the health report.
# Does not run the full chezmoi apply - copies the nvim config directly.

name: nvim health check

on:
  push:
    paths:
      - "dot_config/nvim/**"
      - "scripts/check-nvim-health.sh"
      - ".github/workflows/nvim-health.yml"
  pull_request:
    paths:
      - "dot_config/nvim/**"
      - "scripts/check-nvim-health.sh"
  workflow_dispatch:

jobs:
  nvim-health:
    name: checkhealth
    runs-on: ubuntu-22.04

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install neovim
        run: |
          curl -LO https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz
          tar -xzf nvim-linux-x86_64.tar.gz -C /tmp
          echo "/tmp/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git \
            curl \
            luarocks \
            build-essential \
            cmake \
            ninja-build \
            ncurses-bin \
            pkg-config \
            ripgrep \
            fd-find

      - name: install node (for tree-sitter-cli)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: install tree-sitter-cli
        run: npm install -g tree-sitter-cli

      - name: copy nvim config
        run: |
          mkdir -p "$HOME/.config"
          # chezmoi uses dot_ prefix convention - copy and rename
          cp -r dot_config/nvim "$HOME/.config/nvim"

      - name: bootstrap vim.pack plugins
        run: |
          # A plain headless boot triggers vim.pack.add() to clone every plugin URL
          # listed in init.lua, and fires the PackChanged autocmd (which builds
          # telescope-fzf-native via `make`). Timeout at 5 minutes in case of a hang.
          timeout 300 nvim --headless -c "qa" 2>/dev/null || true
        env:
          TERM: xterm-256color

      - name: run checkhealth
        run: |
          chmod +x scripts/check-nvim-health.sh
          bash scripts/check-nvim-health.sh
        env:
          TERM: xterm-256color
