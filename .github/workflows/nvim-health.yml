# .github/workflows/nvim-health.yml
# Validates the NeoVim config by running :checkhealth headlessly.
# Fails the workflow if any ERROR lines appear in the health report.
# Does not run the full chezmoi apply - copies the nvim config directly.

name: nvim health check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "dot_config/nvim/**"
      - "scripts/check-nvim-health.sh"
      - "scripts/ci-local.sh"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nvim-health:
    name: checkhealth
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install neovim
        run: |
          case "$(uname -m)" in
            x86_64)
              archive="nvim-linux-x86_64"
              checksum="bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875"
              ;;
            aarch64|arm64)
              archive="nvim-linux-arm64"
              checksum="1aa5ca085249580ae0f91eb14f27ec0919773ff2d99a163d03f3d6c21ac29725"
              ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fLO "https://github.com/neovim/neovim/releases/download/v0.12.5/${archive}.tar.gz"
          echo "${checksum}  ${archive}.tar.gz" | sha256sum --check --strict
          tar -xzf "${archive}.tar.gz" -C /tmp
          echo "/tmp/${archive}/bin" >> "$GITHUB_PATH"

      - name: install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git \
            curl \
            luarocks \
            build-essential \
            cmake \
            ninja-build \
            ncurses-bin \
            pkg-config \
            ripgrep \
            fd-find

      - name: install node (for tree-sitter-cli)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: install tree-sitter-cli
        run: npm install -g tree-sitter-cli@0.27.0

      - name: copy nvim config
        run: |
          mkdir -p "$HOME/.config"
          cp -r dot_config/nvim "$HOME/.config/nvim"

      - name: cache vim.pack plugin tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/nvim/site/pack
          key: nvim-pack-${{ runner.os }}-${{ hashFiles('dot_config/nvim/nvim-pack-lock.json', 'dot_config/nvim/init.lua') }}
          restore-keys: |
            nvim-pack-${{ runner.os }}-

      - name: nvim bootstrap and health check
        run: bash scripts/ci-local.sh --only-nvim-health
        env:
          TERM: xterm-256color
