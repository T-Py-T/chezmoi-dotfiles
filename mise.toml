# mise.toml
# Manages language runtime versions only.
# CLI tools (ripgrep, fzf, fd, kubectl, etc.) are installed via Homebrew Brewfiles.
# Does not install tools automatically on its own.

[tools]
# Language runtimes - mise is the right tool for pinned runtime versions.
# All other tools (starship, ripgrep, fzf, etc.) are installed via Homebrew Brewfiles.
python = "3.14.3"
go     = "1.25.7"
rust   = "1.93.0"
node   = "22.12.0"
