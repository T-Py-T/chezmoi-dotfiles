# dot_config/starship.toml
# Starship shell prompt configuration for bash and zsh
# Top banner: location + git info
# Bottom banner: versions, tools, time
# Prompt glyph: minimal ">" via [character] below.

format = """
$directory$git_branch$git_status
$nodejs$python$golang$rust$docker_context$kubernetes$time$character"""

command_timeout = 500
scan_timeout = 10

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"


[directory]
truncate_to_repo = true
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
style = "bold cyan"
read_only = " 🔒"
read_only_style = "red"
format = "[$read_only]($read_only_style)[$path]($style) "

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold purple"
truncation_length = 20
truncation_symbol = "…"

[git_status]
format = "([$all_status$ahead_behind]($style))"
style = "bold red"
conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?"
stashed = "*"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[nodejs]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold green"
detect_extensions = ["js", "mjs", "cjs", "ts", "mts", "cts"]
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

[python]
symbol = "🐍 "
format = "[$symbol($version)]($style) "
style = "bold yellow"
pyenv_version_name = false
pyenv_prefix = "pyenv "
detect_extensions = ["py"]
detect_files = [".python-version", "Pipfile", "__pycache__", "pyproject.toml", "requirements.txt", "setup.py", "tox.ini"]
detect_folders = []

[golang]
symbol = "🐹 "
format = "[$symbol($version)]($style) "
style = "bold cyan"
detect_extensions = ["go"]
detect_files = ["go.mod", "go.sum", "glide.yaml", "Gopkg.yml", "Gopkg.lock"]
detect_folders = []

[rust]
symbol = "🦀 "
format = "[$symbol($version)]($style) "
style = "bold red"
detect_extensions = ["rs"]
detect_files = ["Cargo.toml", "Cargo.lock"]
detect_folders = []

[docker_context]
symbol = "🐳 "
format = "[$symbol$context]($style) "
style = "bold blue"
detect_extensions = []
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]
detect_folders = []

[kubernetes]
symbol = "☸ "
format = "[$symbol$context]($style) "
style = "bold blue"
disabled = false
detect_extensions = []
detect_files = ["kubeconfig"]
detect_folders = []

[time]
disabled = false
format = "at [$time]($style) "
style = "bold white"
use_12hr = false
time_format = "%H:%M"

[line_break]
disabled = false

[status]
symbol = "✖"
success_symbol = ""
format = '[\[$symbol$status\]]($style) '
map_symbol = true
style = "bold red"
disabled = true

[shell]
format = "via [$indicator]($style) "
symbol = ""
style = "cyan bold"
disabled = true

[battery]
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "💀"
unknown_symbol = "🔋"

[[battery.display]]
threshold = 10
style = "bold red"

[[battery.display]]
threshold = 30
style = "bold yellow"

[[battery.display]]
threshold = 100
style = "bold green"
