# .mise/tasks.toml
# Defines common mise tasks for local chezmoi workflow.
# Does not run tasks automatically.

[tasks."chezmoi:init"]
description = "Init chezmoi from local source directory"
run = "chezmoi init --source \"$CHEZMOI_SOURCE_DIR\""

[tasks."chezmoi:dry-run"]
description = "Preview dotfile changes without applying"
run = "chezmoi apply --dry-run --source \"$CHEZMOI_SOURCE_DIR\""

[tasks."chezmoi:apply"]
description = "Apply dotfiles from local source directory"
run = "chezmoi apply --source \"$CHEZMOI_SOURCE_DIR\""
